name: Validate and deploy
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      environment:
        description: Deployment environment
        type: choice
        options: [dev, prod]
        default: dev

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    env:
      AWS_DEFAULT_REGION: us-east-1
      AWS_REGION: us-east-1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            backend/graphql-server/package-lock.json
            backend/lambda/package-lock.json
      - name: Build and lint frontend
        working-directory: frontend
        run: npm ci && npm run lint && npm run build
      - name: Build GraphQL server
        working-directory: backend/graphql-server
        run: npm ci && npm run build
      - uses: aws-actions/setup-sam@v2
      - name: Check and build Lambda
        working-directory: backend/lambda
        run: npm ci && npx tsc --noEmit && sam validate && PATH="$PWD/node_modules/.bin:$PATH" sam build
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.14.0
      - name: Validate Terraform
        run: |
          terraform fmt -check -recursive infrastructure
          terraform -chdir=infrastructure/environments/dev init -backend=false -input=false
          terraform -chdir=infrastructure/environments/dev validate

  deploy:
    if: github.ref == 'refs/heads/main' && (github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && vars.AUTO_DEPLOY_DEV == 'true'))
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: ${{ inputs.environment || 'dev' }}
    concurrency:
      group: graphql-release-${{ inputs.environment || 'dev' }}
      cancel-in-progress: false
    permissions:
      id-token: write
      contents: read
    env:
      AWS_REGION: us-east-1
      ENVIRONMENT: ${{ inputs.environment || 'dev' }}
      RELEASE_ID: ${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
      ECR_REPO_URL: ${{ vars.ECR_REPO_URL }}
      FRONTEND_BUCKET: ${{ vars.FRONTEND_BUCKET }}
      RELEASE_BUCKET: ${{ vars.RELEASE_BUCKET }}
      FRONTEND_URL: ${{ vars.FRONTEND_URL }}
      ECS_CLUSTER: ${{ vars.ECS_CLUSTER }}
      ECS_SERVICE: ${{ vars.ECS_SERVICE }}
      ECS_TASK_DEFINITION: ${{ vars.ECS_TASK_DEFINITION }}
      DB_SECRET_ARN: ${{ vars.DB_SECRET_ARN }}
      ACCESS_TOKEN_ARN: ${{ vars.ACCESS_TOKEN_ARN }}
      LAMBDA_SG_ID: ${{ vars.LAMBDA_SG_ID }}
      APP_SUBNET_A: ${{ vars.APP_SUBNET_A }}
      APP_SUBNET_B: ${{ vars.APP_SUBNET_B }}
      SAM_EXECUTION_ROLE_ARN: ${{ vars.SAM_EXECUTION_ROLE_ARN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: aws-actions/setup-sam@v2
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: us-east-1
      - name: Release application
        run: bash scripts/release.sh
